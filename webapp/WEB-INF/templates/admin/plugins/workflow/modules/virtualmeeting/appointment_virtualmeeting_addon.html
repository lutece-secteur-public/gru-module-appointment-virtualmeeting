<#if host_url?? && host_url?has_content>
    <div class="form-group">
        <label>#i18n{module.appointment.virtualmeeting.addon.labelLink}</label>
        <div><a href="${host_url}" target="_blank">${host_url}</a></div>
    </div>
</#if>
-->
<!-- Linkify plain-text URLs in the form response list above using stable data-id-entry selectors -->
<script>
(function(){
    var guestIds = [<#list guest_entry_ids as id>${id?c}<#sep>,</#list>];
    var hostIds = [<#list host_entry_ids as id>${id?c}<#sep>,</#list>];
    var allIds = guestIds.concat(hostIds);
    if(!allIds.length) return;
    allIds.forEach(function(id){
        var el = document.querySelector('[data-id-entry="' + id + '"]');
        if(el){
            var text = el.textContent.trim();
            if(text && (text.startsWith('http://') || text.startsWith('https://'))){
                el.innerHTML = '<a href="' + text.replace(/"/g,'&quot;') + '" target="_blank">' +
                    text.replace(/</g,'&lt;').replace(/>/g,'&gt;') + '</a>';
            }
        }
    });
})();
</script>
