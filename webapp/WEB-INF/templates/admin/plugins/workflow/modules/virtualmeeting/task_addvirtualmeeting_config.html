<div class="form-group">
    <label for="provider">#i18n{module.appointment.virtualmeeting.task.config.labelProvider}</label>
    <select name="provider" id="provider" class="form-control">
        <#list provider_list as item>
            <option value="${item.code}" <#if config.provider?? && config.provider == item.code>selected</#if>>${item.name}</option>
        </#list>
    </select>
    <small class="form-text text-muted">#i18n{module.appointment.virtualmeeting.task.config.labelProvider.help}</small>
</div>
